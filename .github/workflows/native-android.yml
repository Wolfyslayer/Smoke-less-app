name: Native Android build (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: npm ci --no-audit --no-fund
      - name: Verify Firebase Android configuration
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Add GOOGLE_SERVICES_JSON_BASE64 as a repository Actions secret before running native Android builds."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          node - <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('google-services.json','utf8'));
          const android = config.client?.find(c => c.client_info?.android_client_info?.package_name === 'com.smokeless.app');
          if (!android) { console.error('::error::Firebase Android package com.smokeless.app saknas.'); process.exit(1); }
          const webClients = [...new Set((android.oauth_client || []).filter(c => c.client_type === 3).map(c => c.client_id))];
          if (webClients.length !== 1 || !/^[0-9]+-[a-z0-9-]+\\.apps\\.googleusercontent\\.com$/.test(webClients[0])) {
            console.error('::error::Förväntade exakt ett giltigt OAuth Web client ID för com.smokeless.app. Ladda ned en uppdaterad google-services.json från Firebase.');
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, 'EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=' + webClients[0] + '\\n');
          console.log('Google OAuth Web client ID hittades och konfigurerades för Expo-bygget.');
          NODE
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify generated APK
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$apk" ]; then
            echo "::error::Android debug APK is missing or empty."
            exit 1
          fi
          echo "Generated APK: $(du -h "$apk" | cut -f1)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smoke-less-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

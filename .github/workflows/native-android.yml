name: Native Android build (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - name: Verify Firebase Android configuration
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Add GOOGLE_SERVICES_JSON_BASE64 as a repository Actions secret before running native Android builds."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > google-services.json
          node -e "const x=require('./google-services.json'); if (!x.client?.some(c=>c.client_info?.android_client_info?.package_name==='com.smokeless.app')) process.exit(1)"
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Verify generated APK
        run: |
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$apk" ]; then
            echo "::error::Android debug APK is missing or empty."
            exit 1
          fi
          echo "Generated APK: $(du -h "$apk" | cut -f1)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: smoke-less-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

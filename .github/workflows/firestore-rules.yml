name: Firestore rules emulator
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: firestore-rules-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Firestore-related changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          if printf '%s\n' "$files" | grep -Eq '^(firestore\.rules$|firestore\.indexes\.json$|firebase\.json$|src/(cloudSchema|cloudSync|cloudSync\.native|cloudSync\.web)\.|src/hooks/useCloudSync\.|tests/firestore\.rules\.test\.cjs$|functions/|\.github/workflows/firestore-rules\.yml$)'; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
            echo "No Firestore-related changes; emulator tests skipped."
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run_tests == 'true'
        with:
          node-version: '22'
          cache: npm
      - name: Cache Firestore emulator binaries
        if: steps.changes.outputs.run_tests == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-${{ hashFiles('firebase.json') }}
          restore-keys: |
            firestore-emulator-${{ runner.os }}-
      - uses: actions/setup-java@v4
        if: steps.changes.outputs.run_tests == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
        if: steps.changes.outputs.run_tests == 'true'
      - name: Install isolated emulator test dependencies (without modifying lockfile)
        if: steps.changes.outputs.run_tests == 'true'
        run: npm install --no-save --package-lock=false --no-audit --no-fund @firebase/rules-unit-testing firebase
      - name: Test account deletion server logic (mock Firebase, no production data)
        if: steps.changes.outputs.run_tests == 'true'
        run: node --test functions/accountDeletion.test.cjs functions/recoverDeletion.test.cjs
      - name: Execute rules tests against Firestore emulator
        if: steps.changes.outputs.run_tests == 'true'
        run: npx --yes firebase-tools emulators:exec --only firestore --project smokeless-rules-test "node --test tests/firestore.rules.test.cjs"
